[project]
name = "echorender"
version = "0.1.0"
description = "RGB super-resolution with routed state-space restoration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lpips>=0.1.4",
    "mamba-ssm==2.2.6.post3; sys_platform == 'linux'",
    "matplotlib>=3.10",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<4.12",
    "nvidia-ml-py>=12",
    "pillow>=10.0",
    "pytorch-msssim>=1.0",
    "pyyaml>=6.0",
    "torch>=2.7",
    "torchvision>=0.22",
    "tqdm>=4.67",
    "einops>=0.8",
    "tensorboard>=2.20",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
mamba-ssm = [{ requirement = "torch", match-runtime = true }, "packaging", "ninja", "wheel", "einops"]
