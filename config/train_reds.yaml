# teacher_weights and runtime.output_dir resolve from the project root; other paths resolve from this file.
model:
  student_config: model.yaml
  student_weights: null
  teacher_weights: weights/dlssnr-logical.safetensors
runtime:
  device: cuda:1
  cpu_threads: 4
  output_dir: output/reds_neutral  # existing directories get _2, _3, ...
training:
  epochs: 100
  profiles: [neutral]
  early_stopping:
    patience: 50  # epochs without sufficient improvement; 0 disables
    min_delta: 0.001  # absolute improvement in reporting.best_metric
  precision: bf16  # Student convolutions/linear/attention use BF16; SSM recurrence and RGB losses stay FP32
  gradient_checkpointing: false  # recompute SSM activations to trade speed for memory
  micro_batch_size: 4  # simultaneous Student images; gradients accumulate to loader.batch_size
  releas: true  # true: cache once and unload Teacher; false: frozen online Teacher, no cache
  max_steps: null
  adapter_size: 320  # full image -> root InputAdapter -> 320x320, no cropping
  distillation_layers: [InputAdapter, E0, E1, E2, E3, E4, VIT, OutputHead, RGB composition]  # RGB composition supervises final RGB; feature names match model.yaml stages
  optimizer:
    lr: 0.001
    momentum: 0.0
    weight_decay: 0.0
  grad_clip: 1.0  # 0 disables clipping
loss:
  distillation: 4.0
  reconstruction: 3.0
  motion: 0.0  # REDS has no ground-truth flow; RAFT still receives gradients through RGB reconstruction
  mid: 1.0
  output: 1.0
  output_rgb: 1.0  # raw RGB residual head MSE
  output_gate: 0.05  # raw history-gate logit MSE
  feature_weights: {InputAdapter: 2.0, E0: 1.0, E1: 1.0, E2: 1.0, E3: 1.0, E4: 1.0, VIT: 3.0, D1: 1.0, D2: 1.0, D3: 2.0}
  teacher_change:
    alpha: 2.0  # detached RGB importance within [1, 1 + alpha]
    tau: 0.1    # mean absolute Teacher change in RGB [0,1] that reaches maximum weight
  vit_feature: 0.5
  vit_affinity: 1.0
  rgb_mse: 1.0
  rgb_ssim: 0.5
  rgb_ms_ssim: 0.8
  rgb_lpips: 0.05  # inside reconstruction; effective weight = reconstruction * rgb_lpips
  appearance: 1.0  # independent additive supervision of final Student RGB against Teacher RGB
  appearance_config:
    weights: {lab_ab: 1.0, lab_l: 1.0, roi_contrast: 0.5, roi_l: 0.25, roi_c: 0.25, roi_s: 0.5, low_frequency: 0.5, high_frequency: 1.0}
    roi_size: 64
    roi_stride: 32  # 50% overlap; include boundary-aligned windows
    gaussian_size: 11
    gaussian_sigma: 2.0  # low = Gaussian RGB; high = RGB - low, retaining signs
    brightness_split: 50.0  # Teacher L* threshold for separate dark/bright MAE logs
  lpips_net: alex  # frozen pretrained perceptual network; gradients flow to Student RGB
  projection: true  # identity-initialized 1x1 student feature adapters
  norm_eps: 0.000001
  affinity_chunk_size: 128  # exact off-diagonal cosine affinity; no token sampling
  ssim_window: 11
  ms_ssim_weights: [0.0448, 0.2856, 0.3001, 0.2363, 0.1333]
validation:
  # Both RGB loss and image-quality metrics use Teacher RGB as reference.
  reference: teacher
  lpips_net: alex  # official pretrained backbone; first run downloads weights
benchmark:
  enabled: true
  warmup: 2
  repeats: 5
  # Once per epoch on the first validation image's prepared extent, batch=1.
  # Times forward only, without feature capture, preprocessing or composition.
logging:
  progress: true
  gpu_poll_seconds: 1.0
schedule:
  kind: cosine  # per optimizer update; no warmup or restarts
  eta_min: 0.000001  # lowest LR; initial LR comes from training.optimizer.lr

augmentation:
  enabled: true
  start_ratio: 0.10  # augmentation cap and operation strength
  max_ratio: 0.25
  peak_fraction: 0.50
  stop_fraction: 0.75
  noise_std: 0.20  # sigma = noise_std * ratio; adjustment factor = 1 + ratio

dataset:
  type: reds
  root: /home/soic/Desktop/REDS
  render_pass: sharp  # Teacher and Student read HR sharp RGB; paired X4 data remains available
  splits:
    train: {source: train, scenes: ['000', '001', '002', '003', '004', '005', '006', '007', '008', '009']}
    # Starter subset keeps Teacher cache bounded; null selects all downloaded sequences.
    val: {source: val, scenes: ['000', '001']}
    test: {source: test, scenes: null}  # sharp test targets are not publicly available
loader:
  batch_size: 16  # effective clips per optimizer update; each clip has one profile
  num_workers: 2
  seed: 42
  train_shuffle: true

reporting:
  enabled: true
  project_name: null  # null uses the reserved training run name
  best_metric: psnr  # validation image mean; loss/lpips minimize, psnr/ssim maximize
  samples_per_mode: 2  # original/noise/brightness/contrast/sharpness: two source images each
  strengths: [0.25, 0.50, 0.75, 1.00]  # validation strengths; factor = 1 + strength, noise sigma = noise_std * strength

# Teacher uses RGB-estimated guides on REDS. Student motion is selected in model.yaml.
rendering:
  noise_index: 1
  temporal: true
  max_frames: 10
  train_min_frames: 1  # sample clip prefixes of length 1..10; frame gradients are truncated
  history_strength: 1.0
  scene_cut_threshold: 0.15
  profiles:
    standard: {style_index: null, tone: null, structure: 1.8, skin_structure: 1.5, auto_structure: 1.0, intensity: 1.8, detail_strength: 1.5, colour_strength: 1.0, detail_radius: 0.5}
    natural: {style_index: null, tone: null, structure: 1.8, skin_structure: 1.5, auto_structure: 1.0, intensity: 1.8, detail_strength: 1.5, colour_strength: 1.0, detail_radius: 0.5}
    cinematic: {style_index: null, tone: null, structure: 1.8, skin_structure: 1.5, auto_structure: 1.0, intensity: 1.8, detail_strength: 1.5, colour_strength: 1.0, detail_radius: 0.5}
    neutral: {style_index: 2, tone: null, structure: 1.8, skin_structure: 1.5, auto_structure: 1.0, intensity: 1.8, detail_strength: 1.5, colour_strength: 1.0, detail_radius: 0.5}
