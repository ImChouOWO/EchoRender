# Internal backbone features: current RGB (3) + aligned historical RGB (3).
# Public model input/output are RGB. No fixed-size global image resize.
# DAG rows: [from, repeats, module, args]; -1 means the previous layer.
# Swin: [channels, depth, heads, window, FFN ratio]; ViT omits window.
# SSM: [channels, depth, state_dim, expand]. Global skip connections are retained.
input_channels: 6
output_channels: 32  # final backbone feature width, before RGB reconstruction
input_layout: BCHW
motion: raft_small  # frozen pretrained RGB alignment; raw / feat are optional
gradient_checkpointing: false
ssm:
  rotation: clockwise
  directions: 2
  window: 8
  stride: 4
  tokens: 128
  prompt_rank: 64
reconstruction:
  scale: 4
  width: 16
  naf_depths: [1, 2]
  restormer_depths: [1, 2]
  middle: 2
backbone:
  - [-1, 1, InputAdapter, [32, 1, 16, 4]]             # 0: RGB/history bottleneck + Swin adapter; full-resolution grid
  - [-1, 1, SwinStage, [32, 2, 1, 8, 4]]              # 1: E0, skip to 25
  - [-1, 1, Downsample, [32]]                         # 2: downsample to E1
  - [-1, 1, SSMStage, [32, 2, 16, 2]]                 # 3: E1, skip to 22
  - [-1, 1, Downsample, [64]]                         # 4: downsample to E2
  - [-1, 1, SSMStage, [64, 4, 16, 2]]                 # 5: E2, skip to 19
  - [-1, 1, Downsample, [128]]                        # 6: downsample to E3
  - [-1, 1, SSMStage, [128, 6, 16, 2]]                # 7: E3, skip to 16
  - [-1, 1, Downsample, [256]]                        # 8: downsample to E4
  - [-1, 1, SwinStage, [512, 8, 16, 8, 4]]            # 9: E4, skip to 13
  - [-1, 1, Downsample, [1024]]                       # 10: downsample to bottleneck
  - [-1, 1, ViTStage, [1024, 8, 32, 4]]               # 11: global ViT bottleneck
head:
  - [[-1, 9], 1, Upsample, [512]]                     # 12: resize to E4; match 512-channel skip
  - [[-1, 9], 1, Add, []]                             # 13: E4 residual merge
  - [-1, 1, SwinStage, [256, 8, 16, 8, 4]]            # 14: decoder E4, 512 -> 256
  - [[-1, 7], 1, Upsample, [128]]                     # 15: resize to E3
  - [[-1, 7], 1, Add, []]                             # 16: E3 residual merge
  - [-1, 1, SwinStage, [128, 8, 8, 8, 4]]             # 17: decoder E3
  - [[-1, 5], 1, Upsample, [64]]                      # 18: resize to E2
  - [[-1, 5], 1, Add, []]                             # 19: E2 residual merge
  - [-1, 1, SwinStage, [64, 6, 4, 8, 4]]              # 20: decoder E2
  - [[-1, 3], 1, Upsample, [32]]                      # 21: resize to E1
  - [[-1, 3], 1, Add, []]                             # 22: E1 residual merge
  - [-1, 1, SwinStage, [32, 4, 2, 8, 4]]              # 23: decoder E1
  - [[-1, 1], 1, Upsample, [32]]                      # 24: resize to E0
  - [[-1, 1], 1, Add, []]                             # 25: E0 residual merge
  - [-1, 1, SwinStage, [32, 5, 1, 8, 4]]              # 26: decoder E0
  - [[-1, 0], 1, Add, []]                             # 27: preserve direct InputAdapter-to-output feature skip
