# Small EchoRenderStudent for one-step pipeline validation, not a trained model.
# Same 28-node encoder/decoder graph as model.yaml, with narrower/shallower stages.
input_channels: 16
output_channels: 4
input_layout: BHWC
backbone:
  - [-1, 1, InputAdapter, [4]]
  - [-1, 1, SwinStage, [4, 1, 1, 8, 2]]
  - [-1, 1, Downsample, [8]]
  - [-1, 1, SwinStage, [8, 1, 1, 8, 2]]
  - [-1, 1, Downsample, [16]]
  - [-1, 1, SwinStage, [16, 1, 2, 8, 2]]
  - [-1, 1, Downsample, [32]]
  - [-1, 1, SwinStage, [32, 1, 4, 8, 2]]
  - [-1, 1, Downsample, [64]]
  - [-1, 1, SwinStage, [64, 1, 8, 8, 2]]
  - [-1, 1, Downsample, [128]]
  - [-1, 1, ViTStage, [128, 1, 8, 2]]
head:
  - [[-1, 9], 1, Upsample, [64]]
  - [[-1, 9], 1, Add, []]
  - [-1, 1, SwinStage, [64, 1, 8, 8, 2]]
  - [[-1, 7], 1, Upsample, [32]]
  - [[-1, 7], 1, Add, []]
  - [-1, 1, SwinStage, [32, 1, 4, 8, 2]]
  - [[-1, 5], 1, Upsample, [16]]
  - [[-1, 5], 1, Add, []]
  - [-1, 1, SwinStage, [16, 1, 2, 8, 2]]
  - [[-1, 3], 1, Upsample, [8]]
  - [[-1, 3], 1, Add, []]
  - [-1, 1, SwinStage, [8, 1, 1, 8, 2]]
  - [[-1, 1], 1, Upsample, [4]]
  - [[-1, 1], 1, Add, []]
  - [-1, 1, SwinStage, [4, 1, 1, 8, 2]]
  - [-1, 1, OutputHead, [4]]
