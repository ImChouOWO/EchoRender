# All paths resolve from the EchoRender root. Outputs must stay under output/.
model:
  config: config/model.yaml
  weights: null  # current SR weights only; use --resume for full continuation
runtime:
  device: cuda:1
  cpu_threads: 4
  output_dir: output/sr
training:
  epochs: 100
  micro_batch_size: 4  # concurrent clips; loader.batch_size is the effective batch
  max_steps: null
  precision: bf16
  optimizer: {lr: 0.001, momentum: 0.0, weight_decay: 0.0}
  grad_clip: 1.0
  early_stopping: {patience: 50, min_delta: 0.001}
loss:
  sr: 1.0
  deblur: 1.0
  denoise: 1.0
  edge: 0.05  # inside deblur supervision
  epsilon: 0.001
schedule:
  kind: cosine  # one step per optimizer update; first initial LR, last eta_min
  eta_min: 0.000001
augmentation:
  enabled: true
  start_ratio: 0.10
  max_ratio: 0.25  # caps augmented clip fraction and training strength
  peak_fraction: 0.50
  stop_fraction: 0.75
  blur_sigma: 2.0  # Gaussian sigma at strength=1, in LR pixels
  noise_std: 0.20  # RGB [0,1] sigma at strength=1
# Initial experiment retains the previous limited-scene approach; null selects all scenes.
dataset:
  root: /home/soic/Desktop/REDS
  scale: 4
  lr_patch_size: 80  # aligned random full-field sampling; HR patch=320, no global resize
  max_frames: 10
  min_frames: 1
  splits:
    train: {source: train, scenes: ['000', '001', '002', '003', '004', '005', '006', '007', '008', '009']}
    val: {source: val, scenes: ['000', '001']}
    test: null  # official REDS test HR is not public; do not invent a test GT
loader:
  batch_size: 16
  num_workers: 2
  seed: 42
  train_shuffle: true
validation:
  tile_size: 80  # LR pixels; output is native HR, with overlapping weighted tile merging
  tile_overlap: 16
  crop_border: 0  # REDS RGB protocol; use identical settings for all comparisons
  test_y_channel: false
  lpips_net: alex
  max_images: null
reporting:
  enabled: true
  best_metric: psnr
  samples_per_mode: 2
  strengths: [0.25, 0.50, 0.75, 1.00]
logging:
  progress: true
  gpu_poll_seconds: 1.0
  tensorboard: true
