# teacher_weights resolves from the project root; other paths resolve from this file.
model:
  student_config: model.yaml
  student_weights: null
  teacher_weights: weights/dlssnr-logical.safetensors
runtime:
  device: cuda:1
  cpu_threads: 4
  output_dir: output/test  # existing directories get _2, _3, ...
training:
  epochs: 10
  gradient_checkpointing: false  # SSM 反向重算：true 節省顯存，false 減少重算
  micro_batch_size: 4  # simultaneous Student images; gradients accumulate to loader.batch_size
  releas: true  # true: cache once and unload Teacher; false: frozen online Teacher, no cache
  max_steps: null
  crop_size: 192  # shared center crop; 0 keeps original image dimensions
  optimizer:
    lr: 0.001
    momentum: 0.0
    weight_decay: 0.0
  grad_clip: 1.0  # 0 disables clipping
loss:
  distillation: 3.0
  reconstruction: 1.0
  mid: 0.5
  output: 0.5
  e1: 1.0
  e2: 1.0
  e3: 1.0
  vit: 1.0
  vit_feature: 0.5
  vit_affinity: 1.0
  rgb_mse: 0.5
  rgb_ssim: 0.2
  rgb_ms_ssim: 0.3
  projection: true  # identity-initialized 1x1 student feature adapters
  norm_eps: 0.000001
  affinity_chunk_size: 128  # exact off-diagonal cosine affinity; no token sampling
  ssim_window: 11
  ms_ssim_weights: [0.0448, 0.2856, 0.3001, 0.2363, 0.1333]
validation:
  # Both RGB loss and image-quality metrics use Teacher RGB as reference.
  reference: teacher
  lpips_net: alex  # official pretrained backbone; first run downloads weights
benchmark:
  enabled: true
  warmup: 2
  repeats: 5
  # Once per epoch on the first validation image's prepared extent, batch=1.
  # Times forward only, without feature capture, preprocessing or composition.
logging:
  progress: true
  gpu_poll_seconds: 1.0
schedule:
  kind: cosine  # per optimizer update; no warmup or restarts
  eta_min: 0.000001  # lowest LR; initial LR comes from training.optimizer.lr

augmentation:
  enabled: true
  start_probability: 0.10
  max_probability: 0.25
  peak_fraction: 0.50
  stop_fraction: 0.75
  noise_std: 0.02  # maximum Gaussian sigma for RGB in [0,1]
  brightness: 0.20  # factor sampled from 1 +/- this value
  contrast: 0.20
  sharpness: 0.50

dataset:
  root: /home/soic/Desktop/MPI-Sintel-complete
  render_pass: clean
  splits:
    train:
      source: training
      scenes: [ambush_2, ambush_4, ambush_5, ambush_6, ambush_7, bamboo_1, bamboo_2,
               bandage_1, bandage_2, cave_2, cave_4, market_2, market_5, market_6,
               mountain_1, shaman_2, shaman_3, sleeping_1, sleeping_2]
    val:
      source: training
      scenes: [alley_1, alley_2, temple_2, temple_3]
    test:
      source: test
      scenes: null
loader:
  batch_size: 16  # effective images per optimizer update6
  num_workers: 0
  seed: 42
  train_shuffle: true
